{% extends 'base.html' %}{% block title %}Dashboard Realisasi — cekjo{% endblock %}{% block content %}
<link rel="stylesheet" href="{{ asset_url('realisasi/dashboard.css') }}">
<section class="realisasi-app"><div class="rd-heading"><a href="/admin" class="button icon-button" aria-label="Kembali">{{ icon('back') }}</a><h1>Dashboard Realisasi</h1></div>
<div class="rd-tools">{% for kind,label in [('pagu','Pagu'),('realisasi','Realisasi')] %}<section class="rd-upload"><strong>{{ label }}</strong><small id="{{ kind }}-updated">Belum diunggah</small><div><label class="button">Upload XLSX<input type="file" accept=".xlsx" data-upload="{{ kind }}" aria-label="Upload {{ label }}" disabled></label><button type="button" data-download="{{ kind }}" disabled>Download XLSX</button></div></section>{% endfor %}</div>
<details class="rd-identity"><summary>Identitas Dinas</summary><form id="rd-identity"><label>Nama dinas<input name="name" maxlength="240" required></label><label>Kode dinas<input name="code" maxlength="100" required></label><button disabled>Simpan</button></form></details>
<p id="rd-status" role="status" aria-live="polite">Memuat data…</p><div id="rd-tree"></div></section>
<script id="rd-config" type="application/json">{{ {'csrf':csrf,'headers':headers}|tojson }}</script>
<script defer src="{{ asset_url('merge-excel/vendor/xlsx.js') }}"></script><script defer src="{{ asset_url('realisasi/core.js') }}"></script><script defer src="{{ asset_url('realisasi/dashboard.js') }}"></script>
{% endblock %}
