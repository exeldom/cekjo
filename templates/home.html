{% extends 'base.html' %}{% block content %}<section class="minimal-catalog"><div class="search">{{ icon('search') }}<input id="catalog-search" type="search" placeholder="Cari tabel…" aria-label="Cari tabel"></div><div class="table-list">{% for t in tables %}<a class="catalog-row" data-name="{{ t.name|lower }}" href="/table/{{ t.id }}"><span class="grow">{{ t.name }}</span></a>{% endfor %}</div><div id="no-results" class="empty" hidden>Tidak ditemukan.</div></section>{% endblock %}
