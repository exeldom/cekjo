{% extends 'base.html' %}{% block content %}<section class="minimal-editor"><div class="editor-toolbar"><a class="button icon-button" href="/admin/settings/tables" title="Kembali" aria-label="Kembali">{{ icon('back') }}</a><div class="grow"></div><a class="button icon-button" href="/table/{{ t.id }}" title="Lihat tabel" aria-label="Lihat tabel">{{ icon('eye') }}</a><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="lock"><button class="icon-button {{ 'is-locked' if t.locked }}" title="{{ 'Terkunci · buka akses publik' if t.locked else 'Publik · kunci akses publik' }}" aria-label="{{ 'Terkunci · buka akses publik' if t.locked else 'Publik · kunci akses publik' }}">{{ icon('lock' if t.locked else 'unlock') }}</button></form><a class="button icon-button" href="/admin/download/{{ t.id }}" title="Download XLSX" aria-label="Download XLSX">{{ icon('download') }}</a><button class="icon-button" type="button" onclick="document.getElementById('replace').showModal()" title="Timpa isi tabel" aria-label="Timpa isi tabel">{{ icon('upload') }}</button><form method="post" data-confirm="Hapus tabel ini beserta seluruh isinya secara permanen?"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="delete"><button class="danger icon-button" title="Hapus tabel" aria-label="Hapus tabel">{{ icon('trash') }}</button></form></div><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="configure"><label><span class="sr-only">Nama tabel</span><input name="name" value="{{ t.name }}" required maxlength="150" placeholder="Nama tabel"></label><div class="tools"><button class="icon-button" type="button" data-check="visible" data-value="yes" title="Pilih semua kolom" aria-label="Pilih semua kolom">{{ icon('all') }}</button><button class="icon-button" type="button" data-check="visible" data-value="no" title="Batalkan semua kolom" aria-label="Batalkan semua kolom">{{ icon('none') }}</button></div><div class="overflow"><table class="config"><thead><tr><th>Kolom</th><th>Tampil</th><th>Filter</th><th>Urutan</th></tr></thead><tbody>{% for col in ordered %}<tr><td>{{ col }}<input type="hidden" name="order" value="{{ col }}"></td><td><input aria-label="Tampilkan {{ col }}" type="checkbox" name="visible" value="{{ col }}" {{ 'checked' if col in t.visible }}></td><td><input aria-label="Filter {{ col }}" type="checkbox" name="filters" value="{{ col }}" {{ 'checked' if col in t.filters }}></td><td class="nowrap"><button type="button" data-move="up" title="Naik" aria-label="Naik">↑</button><button type="button" data-move="down" title="Turun" aria-label="Turun">↓</button></td></tr>{% endfor %}</tbody></table></div><div class="actionbar spaced"><button class="primary icon-button" title="Simpan pengaturan" aria-label="Simpan pengaturan">{{ icon('save') }}</button></div></form></section><dialog id="replace" aria-label="Timpa isi tabel"><form method="post" enctype="multipart/form-data" data-confirm="Ganti seluruh isi tabel dengan file ini? Data lama akan ditimpa."><div class="actionbar"><button type="button" class="icon-button" onclick="this.closest('dialog').close()" title="Tutup" aria-label="Tutup">{{ icon('close') }}</button></div><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="update"><label class="filebox"><span class="sr-only">File XLSX pengganti</span><input type="file" name="file" accept=".xlsx" required aria-label="File XLSX pengganti"></label><div class="actionbar"><button class="primary icon-button" title="Timpa isi tabel" aria-label="Timpa isi tabel">{{ icon('upload') }}</button></div></form></dialog>{% endblock %}
