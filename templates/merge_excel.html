{% extends 'base.html' %}{% block title %}Gabung Laporan Realisasi — cekjo{% endblock %}{% block content %}
<style>.merge-app{max-width:780px;margin:auto}.merge-heading{display:flex;align-items:center;gap:16px;margin-bottom:24px}.merge-heading h1{font-size:28px;margin:0}.merge-drop{display:flex;flex-direction:column;align-items:center;gap:12px;padding:38px 20px;border:2px dashed var(--line);border-radius:22px;background:rgba(255,255,255,.65);text-align:center;cursor:pointer}.merge-drop.dragging{border-color:var(--ink);background:#fff}.merge-drop input{max-width:100%;font:inherit}.merge-drop small{color:var(--muted)}.merge-files{list-style:none;padding:0;margin:20px 0}.merge-files li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.merge-files span{overflow-wrap:anywhere;min-width:0}.merge-files button{flex-shrink:0}.merge-app #merge-run{width:100%}.merge-app #merge-status{overflow-wrap:anywhere;min-height:28px}</style>
<section class="merge-app"><div class="merge-heading"><a href="/admin" class="button icon-button" aria-label="Kembali">{{ icon('back') }}</a><h1>Gabung Laporan Realisasi</h1></div>
<label id="merge-drop" class="merge-drop"><strong>Taruh file Excel di sini</strong><input id="merge-picker" type="file" accept=".xlsx" multiple aria-label="Pilih file Excel"><small>A–AS · Header baris 5 · Total terakhir setiap file dihapus</small></label>
<ul id="merge-files" class="merge-files" aria-label="Urutan file"></ul><button id="merge-run" type="button" disabled>Gabung &amp; Download</button><p id="merge-status" role="status" aria-live="polite"></p></section>
<script defer src="{{ asset_url('merge-excel/vendor/xlsx.js') }}"></script><script defer src="{{ asset_url('merge-excel/core.js') }}"></script><script defer src="{{ asset_url('merge-excel/merge.js') }}"></script>
{% endblock %}
