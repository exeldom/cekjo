<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Chat</title><link rel="stylesheet" href="{{ asset_url('chat/chat.css') }}"></head><body><main class="chat"><header>{% if chat.admin %}<a href="/admin/sharing" aria-label="Kembali">‹</a>{% endif %}<strong>Chat</strong><small id="chat-expiry"></small></header><section id="chat-messages" aria-label="Percakapan" role="log" aria-live="polite"></section><p id="chat-status" role="status"></p>{% if chat.can_send %}<form id="chat-form"><div id="chat-selected" hidden><span></span><button type="button" id="chat-remove" aria-label="Hapus lampiran">×</button></div><div class="composer"><label class="attach" title="Lampiran"><span aria-hidden="true">＋</span><input id="chat-file" type="file" aria-label="Pilih file atau gambar, maksimal 20 MB"></label><textarea id="chat-body" rows="1" maxlength="4000" placeholder="Pesan…" aria-label="Pesan"></textarea><button id="chat-send" aria-label="Kirim" type="submit">↑</button></div></form>{% else %}<p class="read-only">Hanya admin yang dapat mengirim pesan.</p>{% endif %}</main><script id="chat-config" type="application/json">{{ chat|tojson }}</script><script defer src="{{ asset_url('chat/chat.js') }}"></script></body></html>
