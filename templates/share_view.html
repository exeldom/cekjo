<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>{{ title }}</title><link rel="stylesheet" href="/static/share-view.css?v=1"></head><body><main><header><h1>{{ title }}</h1><span id="expiry"></span></header><p id="view-message" role="status">{{ '' if text is not none else 'Memuat preview…' }}</p><nav id="view-tools" hidden aria-label="Navigasi dokumen"><select id="view-sheet" aria-label="Sheet" hidden></select><button id="view-prev" aria-label="Halaman sebelumnya">←</button><span id="view-page"></span><button id="view-next" aria-label="Halaman berikutnya">→</button></nav><article id="view-content">{% if text is not none %}<pre>{{ text }}</pre>{% endif %}</article><p id="view-note"></p></main><script id="viewer-config" type="application/json">{{ viewer|tojson }}</script><script type="module" src="/static/share-view.js?v=1"></script></body></html>
