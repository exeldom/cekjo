{% extends 'base.html' %}{% block title %}Berbagi Data — cekjo{% endblock %}{% block content %}
<link rel="stylesheet" href="/static/sharing.css?v=3"><section class="share-page"><a class="button icon-button" href="/admin/settings" aria-label="Pengaturan">{{ icon('back') }}</a><div class="page-heading"><h1>Berbagi Data</h1><button type="button" class="primary" id="share-add">{{ icon('plus') }} Tambah</button></div>
<div class="share-list">{% for t in shares %}<div class="share-row"><button class="share-copy" type="button" data-link="/admin/sharing/{{ t.manage_key }}/link" {% if not t.active %}disabled{% endif %}><strong>{{ t.original_filename }}</strong><small>{{ 'Preview' if t.file_mode == 'preview' else 'File' if t.content_kind == 'file' else 'Link' if t.content_kind == 'link' else 'Teks' }} · {{ t.condition }}{{ ' • ' if t.condition }}{{ t.label }}</small></button><details class="share-actions"><summary aria-label="Tindakan untuk {{ t.original_filename }}">{{ icon('settings') }}</summary><div><a href="/admin/sharing/{{ t.manage_key }}/analysis">Analisa</a><button type="button" data-delete="/admin/sharing/{{ t.manage_key }}/delete">Hapus</button></div></details></div>{% else %}<p class="empty">Belum ada data dibagikan.</p>{% endfor %}</div></section>
<dialog id="share-dialog" aria-labelledby="share-title"><form id="share-form"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="section-head"><h2 id="share-title">Berbagi Data</h2><button type="button" class="icon-button" id="share-close" aria-label="Tutup">{{ icon('close') }}</button></div>
<fieldset><div class="share-kinds" role="group" aria-label="Jenis data"><label><input type="radio" name="kind" value="file" required>File</label><label><input type="radio" name="kind" value="link">Link</label><label><input type="radio" name="kind" value="text">Teks</label></div>
<div id="file-fields" hidden><label>Tampilan<select name="file_mode" id="file-mode"><option value="download">Download</option><option value="preview">Preview saja</option></select></label><label id="share-drop" class="share-drop">Pilih atau letakkan file di sini<input id="share-file" type="file" aria-label="Pilih file"><span id="share-filename"></span></label><small id="file-limit">Maksimal 500 MB</small></div>
<div id="content-fields" hidden><label>Judul<input name="title" maxlength="240" disabled required></label><label id="link-field" hidden>URL tujuan<input name="url" type="url" maxlength="2048" placeholder="https://" disabled required></label><label id="text-field" hidden>Teks<textarea name="text" rows="7" maxlength="100000" disabled required></textarea></label></div>
<div id="share-options" hidden><label>Kondisi<select name="mode" id="share-mode"><option value="download">Batas akses</option><option value="time">Batas waktu</option><option value="download-passcode">Batas akses + Passcode</option><option value="time-passcode">Batas waktu + Passcode</option></select></label><label id="download-field">Jumlah akses<select name="downloads">{% for n in range(1,11) %}<option value="{{ n }}">{{ n }}</option>{% endfor %}</select></label><label id="time-field" hidden>Durasi (menit)<input type="number" name="minutes" min="1" max="1440" value="60" inputmode="numeric"><small>1 menit–24 jam sejak dibuat</small></label><label id="passcode-field" hidden>Passcode<input name="passcode" type="password" minlength="4" maxlength="128" autocomplete="new-password"></label><progress id="share-progress" max="100" value="0" hidden></progress><button class="primary wide" id="share-save">Simpan</button></div></fieldset><p id="share-error" role="alert"></p></form></dialog><div id="share-toast" class="share-toast" role="status" hidden></div><script defer src="/static/sharing.js?v=3"></script>{% endblock %}
