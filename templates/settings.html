{% extends 'base.html' %}{% block content %}<section class="minimal-catalog"><div class="actionbar"><button class="primary icon-button" onclick="document.getElementById('upload').showModal()" title="Tambah tabel" aria-label="Tambah tabel">{{ icon('plus') }}</button></div>{% for t in tables %}<div class="catalog-row"><a class="grow" href="/table/{{ t.id }}">{{ t.name }}</a><span class="status-icon" title="{{ 'Terkunci' if t.locked else 'Publik' }}" aria-label="{{ 'Terkunci' if t.locked else 'Publik' }}">{{ icon('lock' if t.locked else 'unlock') }}</span><a class="icon-button button" href="/admin/settings/{{ t.id }}" title="Atur {{ t.name }}" aria-label="Atur {{ t.name }}">{{ icon('settings') }}</a></div>{% endfor %}</section><dialog id="upload" aria-label="Tambah tabel"><form method="post" enctype="multipart/form-data"><div class="actionbar"><button type="button" class="icon-button" onclick="this.closest('dialog').close()" title="Tutup" aria-label="Tutup">{{ icon('close') }}</button></div><input type="hidden" name="csrf" value="{{ csrf }}"><label><span class="sr-only">Nama tabel</span><input name="name" required maxlength="150" placeholder="Nama tabel"></label><label class="filebox"><span class="sr-only">File XLSX</span><input type="file" name="file" accept=".xlsx" required aria-label="File XLSX"></label><div class="actionbar"><button class="primary icon-button" title="Unggah tabel" aria-label="Unggah tabel">{{ icon('upload') }}</button></div></form></dialog>{% endblock %}
