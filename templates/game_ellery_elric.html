<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf0dc"><meta name="apple-mobile-web-app-capable" content="yes"><title>Ellery &amp; Elric Adventure · cekjo</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><link rel="stylesheet" href="{{ game_root }}game.css?v={{ game_version }}"></head>
<body>
<div id="game" aria-label="Ellery dan Elric, petualangan hutan"></div>
<header id="hud" hidden><div class="portraits"><span id="ellery-badge" class="badge active"><span class="portrait-asset" role="img" aria-label="Ellery" style="background-image:url('{{ game_root }}assets/ellery-sprites.png?v={{ game_version }}')"></span>Ellery</span><span id="elric-badge" class="badge"><span class="portrait-asset" role="img" aria-label="Elric" style="background-image:url('{{ game_root }}assets/elric-sprites.png?v={{ game_version }}')"></span>Elric</span></div><span class="stars" aria-label="Bintang">★ <b id="stars">0</b></span><button id="pause" aria-label="Jeda">Ⅱ</button></header>
<div id="hint" role="status" hidden></div>
<div id="controls" hidden><div class="move"><button data-key="left" aria-label="Kiri">◀</button><button data-key="right" aria-label="Kanan">▶</button></div><div class="actions"><button data-key="switch" id="switch" aria-label="Ganti karakter"><span>⇄</span><small>Switch</small></button><button data-key="power" id="power" aria-label="Gunakan kekuatan"><span>✦</span><small>Power</small></button><button data-key="jump" aria-label="Lompat">↑</button></div></div>
<section id="start-panel" class="veil"><div class="card"><div class="eyebrow">ENCHANTED FOREST</div><h1>Ellery &amp; Elric<br><em>Adventure</em></h1><div class="hero-pair"><span class="portrait-asset" role="img" aria-label="Ellery" style="background-image:url('{{ game_root }}assets/ellery-sprites.png?v={{ game_version }}')"></span><span class="portrait-asset" role="img" aria-label="Elric" style="background-image:url('{{ game_root }}assets/elric-sprites.png?v={{ game_version }}')"></span></div><button id="start" disabled>Menyiapkan hutan…</button><a href="/home">Kembali ke Home</a><p id="load-message" role="status"></p></div></section>
<section id="pause-panel" class="veil" hidden><div class="card"><h2>Istirahat sebentar</h2><button id="resume">Lanjut</button><button id="restart" class="secondary">Ulang</button><button id="sound" class="secondary">Suara: aktif</button><a href="/home">Kembali ke Home</a></div></section>
<section id="reward-panel" class="veil" hidden><div class="card"><div class="eyebrow">PETUALANGAN SELESAI</div><h2 id="reward-title"></h2><img id="reward-image" class="reward" alt=""><p id="reward-name"></p><button id="again">Main Lagi</button><a href="/home">Kembali ke Home</a></div></section>
<section id="rotate" class="veil" hidden><div class="card"><div class="rotate-icon">↻</div><h2>Putar perangkat, yuk!</h2><p>Petualangan dimainkan menyamping.</p><a href="/home">Kembali ke Home</a></div></section>
<script>window.ELCI={{ game_config|tojson }};</script>
<script src="{{ game_root }}vendor/phaser-3.90.0.min.js?v={{ game_version }}"></script><script src="{{ game_root }}rules.js?v={{ game_version }}"></script><script src="{{ game_root }}art.js?v={{ game_version }}"></script><script src="{{ game_root }}game.js?v={{ game_version }}"></script>
</body></html>
